name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── JOB 1: PRUEBAS ───────────────────────────────────────────────────
  test:
    name: Validación y Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Instalar dependencias
        run: |
          cd app
          npm install

      - name: Ejecutar pruebas unitarias
        run: |
          cd app
          npm test

  # ─── JOB 2: VALIDAR TERRAFORM ─────────────────────────────────────────
  terraform-validate:
    name: Validación Terraform
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check

  # ─── JOB 3: DESPLIEGUE ────────────────────────────────────────────────
  deploy:
    name: Preparación del Despliegue
    runs-on: ubuntu-latest
    needs: [test, terraform-validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Verificar conexión con AWS
        run: aws sts get-caller-identity

      - name: Despliegue listo
        run: |
          echo "✅ Código validado y pruebas exitosas"
          echo "✅ Credenciales AWS configuradas"
          echo "✅ Infraestructura lista para terraform apply"
